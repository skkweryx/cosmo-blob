<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#100c2b">
<title>Космо-Блоб</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#100c2b; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body { touch-action: none; }
  #game { display:block; width:100vw; height:100dvh; }
  #hint { position:fixed; left:0; right:0; bottom:calc(16px + env(safe-area-inset-bottom)); text-align:center; color:#c8c5ff; font-size:12px; letter-spacing:.08em; pointer-events:none; opacity:.8; }
</style>
</head>
<body>
<canvas id="game" aria-label="Космо-Блоб — нажимай, чтобы лететь"></canvas>
<div id="hint">НАЖМИ НА ЭКРАН, ЧТОБЫ ЛЕТЕТЬ</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  let W=0,H=0,dpr=1, state='ready', score=0, best=Number(localStorage.getItem('cosmoBlobBest')||0);
  let blob, obstacles=[], stars=[], last=0, spawnTimer=0, speed=190, bgShift=0;
  const rand=(a,b)=>a+Math.random()*(b-a);
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    stars=Array.from({length:Math.max(45,Math.floor(W*H/8500))},()=>({x:Math.random()*W,y:Math.random()*H,r:rand(.5,1.8),v:rand(8,28),a:rand(.25,.9)}));
    if(!blob) reset();
    else { blob.x=W*.28; blob.r=Math.max(15,Math.min(21,W*.047)); }
  }
  function reset(){
    score=0; speed=Math.max(175,Math.min(220,W*.48)); spawnTimer=0; bgShift=0;
    blob={x:W*.28,y:H*.45,vy:0,r:Math.max(15,Math.min(21,W*.047)),rot:0};
    obstacles=[];
    state='ready';
    hint.textContent='НАЖМИ НА ЭКРАН, ЧТОБЫ ЛЕТЕТЬ';
  }
  function startOrFlap(){
    if(state==='over'){reset(); state='playing'; blob.vy=-390; hint.textContent=''; return;}
    if(state==='ready'){state='playing';hint.textContent='';}
    if(state==='playing') blob.vy=-390;
  }
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();startOrFlap();});
  window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();startOrFlap();}});
  window.addEventListener('resize',resize);
  function roundedRect(x,y,w,h,r){
    ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  }
  function drawBackground(dt){
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#100c2b'); g.addColorStop(.55,'#21145a'); g.addColorStop(1,'#090f2d');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    bgShift=(bgShift+dt*12)%W;
    for(const s of stars){
      if(state==='playing') s.x-=s.v*dt;
      if(s.x<0)s.x=W;
      ctx.globalAlpha=s.a;
      ctx.fillStyle='#e7e5ff';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    // distant planets
    ctx.globalAlpha=.22;
    ctx.fillStyle='#9d75ff';ctx.beginPath();ctx.arc(W*.82,H*.19,Math.min(W,H)*.095,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.25;ctx.strokeStyle='#d7c8ff';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(W*.82,H*.19,Math.min(W,H)*.14,Math.min(W,H)*.035,-.35,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }
  function drawBlob(){
    ctx.save();ctx.translate(blob.x,blob.y);ctx.rotate(Math.max(-.35,Math.min(.6,blob.vy/700)));
    // glow
    ctx.shadowColor='#b45cff';ctx.shadowBlur=22;
    const grad=ctx.createRadialGradient(-blob.r*.35,-blob.r*.45,2,0,0,blob.r*1.4);
    grad.addColorStop(0,'#f1c7ff');grad.addColorStop(.35,'#c36bff');grad.addColorStop(1,'#7134db');
    ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(0,0,blob.r*1.12,blob.r,0,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // tiny antenna
    ctx.strokeStyle='#e5b8ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(2,-blob.r*.78);ctx.quadraticCurveTo(8,-blob.r*1.5,13,-blob.r*1.28);ctx.stroke();
    ctx.fillStyle='#ffdf6e';ctx.beginPath();ctx.arc(13,-blob.r*1.28,3,0,Math.PI*2);ctx.fill();
    // eyes
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-blob.r*.28,-blob.r*.08,blob.r*.22,blob.r*.29,-.1,0,Math.PI*2);ctx.ellipse(blob.r*.3,-blob.r*.08,blob.r*.22,blob.r*.29,.1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#25134d';ctx.beginPath();ctx.arc(-blob.r*.22,-blob.r*.02,blob.r*.105,0,Math.PI*2);ctx.arc(blob.r*.36,-blob.r*.02,blob.r*.105,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#4b1d84';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(0,blob.r*.22,blob.r*.23,.15,Math.PI-.15);ctx.stroke();
    ctx.restore();
  }
  function spawnObstacle(){
    const gap=Math.max(142,Math.min(190,H*.235));
    const margin=72;
    const gapY=rand(margin+gap/2, H-margin-gap/2);
    obstacles.push({x:W+30,w:Math.max(54,Math.min(70,W*.16)),gapY,gap,passed:false});
  }
  function drawObstacle(o){
    const topH=o.gapY-o.gap/2, bottomY=o.gapY+o.gap/2;
    const drawPillar=(x,y,w,h,top)=>{
      const grad=ctx.createLinearGradient(x,0,x+w,0);
      grad.addColorStop(0,'#2469a8');grad.addColorStop(.45,'#4be6e0');grad.addColorStop(1,'#7b67ff');
      ctx.fillStyle=grad;ctx.shadowColor='#38e7e0';ctx.shadowBlur=13;
      roundedRect(x,y,w,h,12);ctx.shadowBlur=0;
      ctx.fillStyle='rgba(9,18,54,.35)';
      for(let yy=y+16;yy<y+h-8;yy+=22) roundedRect(x+8,yy,w-16,4,2);
      ctx.fillStyle='#b8fff7';roundedRect(x-5,top?h-0+y-9:y-1,w+10,10,5);
    };
    drawPillar(o.x,0,o.w,topH,true);
    drawPillar(o.x,bottomY,o.w,H-bottomY,false);
  }
  function endGame(){
    state='over';best=Math.max(best,score);localStorage.setItem('cosmoBlobBest',String(best));
    hint.textContent='НАЖМИ, ЧТОБЫ ПОПРОБОВАТЬ ЕЩЁ РАЗ';
  }
  function update(dt){
    if(state!=='playing')return;
    blob.vy+=1050*dt;blob.y+=blob.vy*dt;
    spawnTimer+=dt;
    if(spawnTimer>1.45){spawnObstacle();spawnTimer=0;}
    speed+=dt*2.2;
    for(const o of obstacles){
      o.x-=speed*dt;
      if(!o.passed&&o.x+o.w<blob.x){o.passed=true;score++;}
      const hitX=blob.x+blob.r*.78>o.x&&blob.x-blob.r*.78<o.x+o.w;
      if(hitX&&(blob.y-blob.r*.78<o.gapY-o.gap/2||blob.y+blob.r*.78>o.gapY+o.gap/2))endGame();
    }
    obstacles=obstacles.filter(o=>o.x+o.w>-20);
    if(blob.y-blob.r<0||blob.y+blob.r>H)endGame();
  }
  function text(str,x,y,size,color='#fff',weight=700){
    ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui,-apple-system,sans-serif`;ctx.textAlign='center';ctx.fillText(str,x,y);
  }
  function drawUI(){
    text('КОСМО-БЛОБ',W/2,Math.max(48,H*.09),Math.min(27,W*.065),'#f4eaff',900);
    if(state==='playing'){
      text(String(score),W/2,Math.max(94,H*.16),42,'#ffffff',900);
    }
    if(state==='ready'){
      ctx.fillStyle='rgba(10,8,35,.42)';roundedRect(W*.09,H*.28,W*.82,190,24);
      text('ПОЛЕТЕЛИ?',W/2,H*.28+49,25,'#f8d9ff',900);
      text('Касайся экрана, чтобы взлететь',W/2,H*.28+86,Math.min(15,W*.038),'#ffffff',600);
      text('Пролетай между космоколоннами',W/2,H*.28+112,Math.min(14,W*.035),'#c8c5ff',500);
      text('Рекорд: '+best,W/2,H*.28+151,15,'#ffe47b',700);
    }
    if(state==='over'){
      ctx.fillStyle='rgba(8,5,30,.76)';roundedRect(W*.1,H*.28,W*.8,220,24);
      text('СТОЛКНОВЕНИЕ!',W/2,H*.28+48,Math.min(25,W*.06),'#ffb8e7',900);
      text('Очки: '+score,W/2,H*.28+91,22,'#ffffff',800);
      text('Рекорд: '+best,W/2,H*.28+122,17,'#ffe47b',700);
      ctx.fillStyle='#7a4dff';roundedRect(W*.23,H*.28+147,W*.54,48,15);
      text('ЕЩЁ РАЗ',W/2,H*.28+178,16,'#ffffff',900);
    }
  }
  function frame(t){
    const dt=Math.min((t-last)/1000||0,0.033);last=t;
    drawBackground(dt);update(dt);
    for(const o of obstacles)drawObstacle(o);
    if(blob)drawBlob();
    drawUI();
    requestAnimationFrame(frame);
  }
  resize();reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
